name: Build Android APK

# Produces a standalone, installable APK and attaches it to a GitHub Release,
# so a tester with no toolchain can open the Releases page on their phone and
# install it in one tap.
#
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.0.

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Name for the release (e.g. field-test-1)'
        required: false
        default: 'field-test'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synapse

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      # A signing key is required for a release build. This one is generated
      # per run and is fine for sideloaded testing — it is deliberately NOT a
      # publishing key, and a Play Store build would use a real, kept secret.
      - name: Create a throwaway signing key
        run: |
          keytool -genkeypair -v \
            -keystore android/app/field-test.keystore \
            -alias field-test \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass fieldtest -keypass fieldtest \
            -dname "CN=Synapse Field Test, OU=Dev, O=Synapse, L=NA, S=NA, C=NA"

      - name: Point Gradle at the key
        run: |
          {
            echo "MYAPP_UPLOAD_STORE_FILE=field-test.keystore"
            echo "MYAPP_UPLOAD_KEY_ALIAS=field-test"
            echo "MYAPP_UPLOAD_STORE_PASSWORD=fieldtest"
            echo "MYAPP_UPLOAD_KEY_PASSWORD=fieldtest"
          } >> android/gradle.properties

      - name: Use the key for release builds
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          if 'MYAPP_UPLOAD_STORE_FILE' not in s:
              s = s.replace(
                  'signingConfigs {',
                  '''signingConfigs {
        fieldtest {
            storeFile file(MYAPP_UPLOAD_STORE_FILE)
            storePassword MYAPP_UPLOAD_STORE_PASSWORD
            keyAlias MYAPP_UPLOAD_KEY_ALIAS
            keyPassword MYAPP_UPLOAD_KEY_PASSWORD
        }''', 1)
              # release build type must use it instead of the debug key
              s = s.replace(
                  'signingConfig signingConfigs.debug\n            minifyEnabled',
                  'signingConfig signingConfigs.fieldtest\n            minifyEnabled', 1)
              p.write_text(s)
              print('signing config wired')
          PY

      - name: Build the release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: synapse/android

      - name: Name the artifact
        id: name
        run: |
          NAME="synapse-${{ github.event.inputs.release_name || github.ref_name }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "apk=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapse-apk
          path: synapse/${{ steps.name.outputs.apk }}
          if-no-files-found: error

      - name: Publish a Release with the APK attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ github.event.inputs.release_name || github.ref_name }}
          files: synapse/${{ steps.name.outputs.apk }}
          generate_release_notes: true
          body: |
            **Установка на телефон**

            1. Открыть эту страницу на телефоне.
            2. Скачать файл `.apk` ниже.
            3. Разрешить установку из этого источника, если Android спросит.
            4. Открыть приложение.

            Подключение Рига и порядок теста — в [TESTING.md](../blob/main/TESTING.md).
