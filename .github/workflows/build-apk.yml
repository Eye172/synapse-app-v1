name: Build Android APK

# Produces a standalone, installable APK and attaches it to a GitHub Release,
# so a tester with no toolchain can open the Releases page on their phone and
# install it in one tap.
#
# Run it from the Actions tab → "Run workflow".
#
# The APK is signed with the debug key Expo generates during prebuild. That is
# the normal arrangement for internal test builds: Android will install it,
# and it is deliberately not a publishing key — a Play Store build would use a
# real one kept in secrets.

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Name for this build (e.g. field-test-1)'
        required: false
        default: 'field-test'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: synapse
        run: npm ci

      - name: Check types and run tests
        working-directory: synapse
        run: |
          npx tsc --noEmit
          npx jest --ci

      - name: Generate the native Android project
        working-directory: synapse
        run: npx expo prebuild --platform android --no-install

      - name: Build the release APK
        working-directory: synapse/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect the APK
        id: collect
        working-directory: synapse
        run: |
          SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$SRC" ]; then
            echo "No APK was produced" >&2
            exit 1
          fi
          NAME="synapse-${{ github.event.inputs.release_name || github.ref_name }}.apk"
          cp "$SRC" "$NAME"
          ls -lh "$NAME"
          echo "apk=synapse/$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapse-apk
          path: ${{ steps.collect.outputs.apk }}
          if-no-files-found: error

      - name: Publish a Release with the APK attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ github.event.inputs.release_name || github.ref_name }}
          files: ${{ steps.collect.outputs.apk }}
          body: |
            ## Установка на телефон

            1. Открыть **эту страницу на телефоне** (не на компьютере).
            2. Пролистать вниз до раздела **Assets** и нажать на файл, который заканчивается на `.apk`.
            3. Android спросит разрешение — нажать **«Настройки»** и включить установку из этого источника, затем **«Установить»**.
            4. Открыть приложение **Synapse**.

            Приложение полностью работает без Рига (демо-режим).
            Подключение Рига и порядок теста — в файле **TESTING.md** в репозитории.
