plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.posevision'
version = '1.0.0'

android {
  namespace "expo.modules.posevision"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // CameraX: this module owns the camera, because the detector needs frames
  // and no Expo surface hands them out.
  //
  // Kept on the same line as expo-camera (1.5.x), which is still in the app as
  // the fallback preview. Gradle resolves one version for the whole APK, and
  // CameraX artifacts are only supported at matching versions — pinning a
  // different minor here would silently move expo-camera onto it too.
  def camerax = "1.5.3"
  implementation "androidx.camera:camera-core:$camerax"
  implementation "androidx.camera:camera-camera2:$camerax"
  implementation "androidx.camera:camera-lifecycle:$camerax"
  implementation "androidx.camera:camera-view:$camerax"
  implementation "androidx.camera:camera-video:$camerax"

  // The same pose landmarker the web harness runs (@mediapipe/tasks-vision
  // 1.0.x there), in its Android build. Pinned rather than `latest.release`,
  // so a build is reproducible and an upgrade is a decision, not a surprise.
  implementation "com.google.mediapipe:tasks-vision:1.0.0"
}
